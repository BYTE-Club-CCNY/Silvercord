apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: silvercord
  labels:
    app: bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: wait-for-agent
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://agent.silvercord.svc.cluster.local:5000/api/v1/health; do
                echo "waiting for agent..."
                sleep 3
              done
      containers:
        - name: bot
          image: ghcr.io/byte-club-ccny/silvercord-bot:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: bot-env
          env:
            - name: API_BASE_URL
              value: "http://api.silvercord.svc.cluster.local:8080"
            - name: AGENT_API_URL
              value: "http://agent.silvercord.svc.cluster.local:5000"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
