apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-chroma
  namespace: silvercord
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: silvercord
  labels:
    app: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: agent
          image: ghcr.io/dddictionary/silvercord-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: agent-env
          volumeMounts:
            - name: chroma
              mountPath: /app/chroma_db
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: chroma
          persistentVolumeClaim:
            claimName: agent-chroma
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: silvercord
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 5000
      targetPort: http
